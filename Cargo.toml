[package]
name = "tasks-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlanMillerSora/lunar-tasks"
description = "Lunar Tasks — native tree-shaped task manager with tags, due dates, reminders and a resident tray daemon"
keywords = ["tasks", "todo", "egui", "wayland", "hyprland"]

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
serde = "1.0.229"
serde_json = "1.0.154"
